name: codebattle 

services:
  db:
    image: postgres:16-alpine
    container_name: codebattle-db
    restart: always
    environment:
      POSTGRES_USER: codebattle
      POSTGRES_PASSWORD: codebattle
      POSTGRES_DB: codebattle
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data

volumes:
  postgres_data: