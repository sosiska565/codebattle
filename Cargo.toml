[package]
name = "codebattle"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
  "chrono",
] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
